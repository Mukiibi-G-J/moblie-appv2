# Codemagic CI — builds the iOS app on a cloud Mac and uploads it to TestFlight.
# No local Mac needed. Setup (once, in the Codemagic web UI):
#   1. Team settings → Integrations → Developer Portal → connect an App Store Connect
#      API key (App Manager role) and name the integration "ZentroApp ASC Key".
#   2. codemagic.yaml settings → Code signing identities: generate an iOS Distribution
#      certificate and fetch the App Store profile for com.zentroapp (uses the key above).
#   3. App Store Connect app already exists (bundle ID com.zentroapp, Apple ID 6838609903).

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: ZentroApp ASC Key
    environment:
      # GoogleService-Info.plist is committed, so no variable group is needed.
      # If you stop committing it, add a group with GOOGLE_SERVICE_INFO_PLIST here.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zentroapp
      vars:
        XCODE_WORKSPACE: "ios/zentroapp.xcworkspace"
        XCODE_SCHEME: "zentroapp"
        BUNDLE_ID: "com.zentroapp"
        APP_STORE_APPLE_ID: 6838609903 # "ZentroApp: Business Management" in App Store Connect
      node: 20
      xcode: latest
      cocoapods: 1.16.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
    scripts:
      - name: Install JS dependencies (runs patch-package)
        # @finan-me/react-native-thermal-printer declares peer react-native >=0.76.9 while the
        # app is on 0.76.1; the lockfile was created with legacy peer deps, so install the same way.
        script: npm ci --legacy-peer-deps

      - name: Add GoogleService-Info.plist
        script: |
          PLIST="ios/zentroapp/GoogleService-Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Using committed $PLIST"
          elif [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$PLIST"
            echo "Wrote $PLIST from environment variable"
          else
            echo "ERROR: $PLIST is missing. Commit it or set GOOGLE_SERVICE_INFO_PLIST (base64) in the zentro_ios group."
            exit 1
          fi

      - name: Install CocoaPods
        script: cd ios && pod install --repo-update

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number (latest TestFlight build + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          cd ios && agvtool new-version -all "$NEXT"

      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
